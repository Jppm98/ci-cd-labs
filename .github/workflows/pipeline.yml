name: CI Pipeline con Pruebas y Quality Gate

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  # Etapa 1: Compilación y Verificación de Sintaxis
  build:
    name: Build & Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar y validar sintaxis de modulos
        run: |
          echo "=========================================="
          echo "   ETAPA 1: COMPILACION Y SINTAXIS"
          echo "=========================================="
          python -m py_compile app/*.py tests/*.py
          echo "Compilacion exitosa. Todos los archivos son sintacticamente validos."

  # Etapa 2: Pruebas Unitarias y Quality Gate
  test:
    name: Unit Tests & Quality Gate
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear directorio para reportes
        run: mkdir -p reports

      - name: Ejecutar pruebas unitarias y medir cobertura
        run: |
          echo "=========================================="
          echo "   ETAPA 2: PRUEBAS UNITARIAS Y COBERTURA"
          echo "=========================================="
          pytest --junitxml=reports/test-results.xml \
                 --cov=app \
                 --cov-report=term-missing \
                 --cov-report=html:reports/coverage-html \
                 tests/

      - name: Publicar Reportes de Pruebas y Cobertura (Artefactos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas-y-cobertura
          path: reports/
          retention-days: 14